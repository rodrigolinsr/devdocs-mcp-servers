services:
  filamentphp-mcp:
    image: ghcr.io/rodrigolinsr/filamentphp-mcp:latest
    container_name: filamentphp-mcp
    pull_policy: always
    expose:
      - "8000"
    restart: always
    mem_limit: ${MCP_MEMORY_LIMIT:-512m}
    memswap_limit: ${MCP_MEMORY_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.0}
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  metronic-mcp:
    image: ghcr.io/rodrigolinsr/metronic-mcp:latest
    container_name: metronic-mcp
    pull_policy: always
    expose:
      - "8000"
    restart: always
    mem_limit: ${MCP_MEMORY_LIMIT:-512m}
    memswap_limit: ${MCP_MEMORY_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.0}
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
