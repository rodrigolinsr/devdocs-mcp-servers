services:
  filamentphp-mcp:
    build:
      context: ./filamentphp
      dockerfile: ./mcp/Dockerfile
    image: filamentphp-mcp:local
    container_name: filamentphp-mcp
    ports:
      - "8001:8000"
    restart: unless-stopped
    mem_limit: ${MCP_MEMORY_LIMIT:-512m}
    memswap_limit: ${MCP_MEMORY_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.0}
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  metronic-mcp:
    build:
      context: ./metronic
      dockerfile: ./mcp/Dockerfile
    image: metronic-mcp:local
    container_name: metronic-mcp
    ports:
      - "8002:8000"
    restart: unless-stopped
    mem_limit: ${MCP_MEMORY_LIMIT:-512m}
    memswap_limit: ${MCP_MEMORY_LIMIT:-512m}
    cpus: ${MCP_CPUS:-1.0}
    pids_limit: ${MCP_PIDS_LIMIT:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
